name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *" # mỗi ngày lúc 07:00 giờ Việt Nam
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#0f6cbd&color_dots=#ebedf0,#b4d6fa,#62abf5,#2886de,#0f6cbd
            dist/snake-dark.svg?color_snake=#62abf5&color_dots=#161b22,#0c3b5e,#115ea3,#2886de,#62abf5

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
